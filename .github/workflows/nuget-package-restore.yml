name: NuGet Package Restore

on:
  workflow_call:
    inputs:
      solution_path:
        description: Solution path to restore.
        required: true
        type: string
      nuget_version:
        description: NuGet version to install.
        required: false
        type: string
        default: '5.7.0'

permissions:
  contents: read

jobs:
  nuget-package-restore:
    runs-on: windows-2019
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          # Parameter passing: caller can pin an approved NuGet version.
          nuget-version: ${{ inputs.nuget_version }}

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "${{ inputs.solution_path }}" -NonInteractive