name: Generate LivingDoc BDD Reports

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted image or self-hosted runner label.
        required: false
        type: string
        default: windows-2022
      script_path:
        description: Path in the calling repository to Generate-LivingDocReports.ps1.
        required: false
        type: string
        default: Generate-LivingDocReports.ps1
      working_directory:
        description: Repository-relative working directory passed to the LivingDoc script.
        required: false
        type: string
        default: .
      project_type:
        description: Project type passed to the LivingDoc script, for example DotnetFramework.
        required: false
        type: string
        default: DotnetFramework

permissions:
  contents: read

jobs:
  generate-livingdoc-reports:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate LivingDoc reports
        shell: pwsh
        run: |
          # Parameter passing: reports are emitted in the called workflow workspace.
          & "${{ inputs.script_path }}" `
            -WorkspacePath "${{ github.workspace }}" `
            -OutputPath "${{ runner.temp }}\livingdoc" `
            -WorkingDirectory (Join-Path "${{ github.workspace }}" "${{ inputs.working_directory }}") `
            -ProjectType "${{ inputs.project_type }}"