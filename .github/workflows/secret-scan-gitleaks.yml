name: Secret Scan - Gitleaks

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted image or self-hosted runner label.
        required: false
        type: string
        default: windows-2022
    secrets:
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  secret-scan-gitleaks:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Parameter passing: the caller provides the optional license as a named secret.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}