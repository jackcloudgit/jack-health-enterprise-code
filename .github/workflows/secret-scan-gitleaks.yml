name: Secret Scan - Gitleaks

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted image or self-hosted runner label.
        required: false
        type: string
        default: windows-2022
      allow_failure:
        description: Whether scan failures should be recorded without failing the calling workflow.
        required: false
        type: boolean
        default: false
    secrets:
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  secret-scan-gitleaks:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout source for secret scan
        uses: actions/checkout@v4
        with:
          # Parameter passing: full history lets Gitleaks scan commit history, not only the current files.
          fetch-depth: 0

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        # Parameter passing: callers opt in only for test pipelines that must continue after findings.
        continue-on-error: ${{ inputs.allow_failure }}
        env:
          # Parameter passing: the caller provides the optional license as a named secret.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}