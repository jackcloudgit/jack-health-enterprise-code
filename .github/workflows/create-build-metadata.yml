name: Create Build Metadata

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted image or self-hosted runner label.
        required: false
        type: string
        default: windows-2022
      script_path:
        description: Path in the calling repository to TCBuildMetadataInfo.ps1.
        required: false
        type: string
        default: TCBuildMetadataInfo.ps1

permissions:
  contents: read

jobs:
  create-build-metadata:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create build metadata
        shell: pwsh
        run: |
          # Parameter passing: GitHub run values replace TeamCity build parameters.
          & "${{ inputs.script_path }}" `
            -BuildId "${{ github.run_id }}" `
            -BuildNumber "${{ github.run_number }}" `
            -BuildAttempt "${{ github.run_attempt }}" `
            -SourceVersion "${{ github.sha }}"